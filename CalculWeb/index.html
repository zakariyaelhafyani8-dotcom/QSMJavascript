<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    
    <div class="calculator">
        <p id="calPa">Casio : Calculaor</p>
        <input type="text" id="display" disabled>
        <div class="btnL1">
            <button onclick="clearDisplay()" class="btnes" id="btnC">C</button>
            <button onclick="deleteLast()" class="btnes" id="btnDelet">delet</button>
            <button onclick="appendValue('%')" class="btnes" id="btnPoucent">%</button>
            <button onclick="appendValue('*')" class="btnesM" id="btnMiltipl">*</button>
        </div>
        <div class="btnL2">
            <button onclick="appendValue('7')" class="btnesN" id="btn7">7</button>
            <button onclick="appendValue('8')" class="btnesN" id="btn8">8</button>
            <button onclick="appendValue('9')" class="btnesN"id="btn9">9</button>
            <button onclick="appendValue('/')" class="btnesM" id="btnDivide">/</button>
        </div>
        <div class="btnL3">
            <button onclick="appendValue('4')" class="btnesN" id="btn4">4</button>
            <button onclick="appendValue('5')" class="btnesN" id="btn5">5</button>
            <button onclick="appendValue('6')" class="btnesN" id="btn6">6</button>
            <button onclick="appendValue('-')" class="btnesM" id="btnMinus">-</button>
        </div>
        <div class="btnL4">
            <button onclick="appendValue('3')" class="btnesN" id="btn3">3</button>
            <button onclick="appendValue('2')" class="btnesN" id="btn2">2</button>
            <button onclick="appendValue('1')" class="btnesN" id="btn1">1</button>
            <button onclick="appendValue('+')" class="btnesM" id="btnPlus">+</button>
        </div>
        <div class="btnL5">
            <button onclick="appendValue('.')" class="btnes" id="btnDote">.</button>
            <button onclick="appendValue('0')" class="btnesN" id="btn0">0</button>
            <button onclick="calculate()" class="btnes" id="btnEqual">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
